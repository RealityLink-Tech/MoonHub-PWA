name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '2' }}

      - name: Validate commit messages
        run: |
          # Clean Commit format: <emoji> <type>[!][(<scope>)]: <description>
          COMMIT_PATTERN='^[📦🔧🗑️🔒⚙️☕🧪📖🚀🔁]\s+(new|update|remove|security|setup|chore|test|docs|release)(\([^)]+\))?!?:\s+.+$'

          # Get commits based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --pretty=format:"%s" origin/${{ github.base_ref }}..HEAD)
          else
            COMMITS=$(git log -1 --pretty=format:"%s")
          fi

          INVALID_COMMITS=""

          while IFS= read -r commit; do
            [ -z "$commit" ] && continue

            # Skip merge commits
            [[ "$commit" =~ ^Merge\  ]] && echo "✅ Skipping merge: $commit" && continue

            # Skip "Initial plan" (Claude Agent)
            [[ "$commit" == "Initial plan" ]] && echo "✅ Skipping initial plan" && continue

            # Validate format
            if ! [[ "$commit" =~ $COMMIT_PATTERN ]]; then
              INVALID_COMMITS="$INVALID_COMMITS\n  - $commit"
            fi
          done <<< "$COMMITS"

          if [ -n "$INVALID_COMMITS" ]; then
            echo "❌ Invalid commits:"
            echo -e "$INVALID_COMMITS"
            echo ""
            echo "Format: <emoji> <type>[!][(<scope>)]: <description>"
            echo ""
            echo "Valid: 📦new 🔧update 🗑️remove 🔒security ⚙️setup ☕chore 🧪test 📖docs 🚀release"
            echo ""
            echo "Examples:"
            echo "  📦 new: add user authentication"
            echo "  🔧 update(chat): improve message rendering"
            exit 1
          fi

          echo "✅ All commits valid"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --passWithNoTests || true
